[package]
name = "apollo_infra_utils"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Infrastructure utility."

[features]
testing = ["colored", "dep:assert-json-diff", "regex", "socket2", "strum", "tempfile"]

[lints]
workspace = true

[dependencies]
apollo_proc_macros.workspace = true
assert-json-diff = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
num_enum.workspace = true
regex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
socket2 = { workspace = true, optional = true }
strum = { workspace = true, optional = true, features = ["derive"] }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["process", "rt", "time"] }

# jemalloc has no WebAssembly build, and its configure rejects the iOS simulator triple.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
assert-json-diff.workspace = true
colored.workspace = true
nix.workspace = true
pretty_assertions.workspace = true
regex.workspace = true
rstest.workspace = true
socket2.workspace = true
strum = { workspace = true, features = ["derive"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
toml.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
